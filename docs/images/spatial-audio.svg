<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="空間オーディオとアバターの意味">
  <style>
    .bg    { fill: #faf8f3; }
    .floor { fill: #eef3e6; stroke: #8b7355; stroke-width: 2; }
    .ring1 { fill: #4a7c59; opacity: 0.16; }
    .ring2 { fill: #4a7c59; opacity: 0.10; }
    .ring3 { fill: #4a7c59; opacity: 0.05; }
    .card  { fill: #ffffff; stroke: #b3a892; stroke-width: 1.5; }
    .t     { font-family: "Hiragino Sans","Noto Sans JP","Yu Gothic",-apple-system,"Segoe UI",sans-serif; fill: #2c2519; }
    .title { font-size: 17px; font-weight: 700; }
    .name  { font-size: 14px; font-weight: 700; }
    .body  { font-size: 13px; }
    .small { font-size: 11.5px; fill: #6b5f4d; }
    .emoji { font-size: 26px; }
    .tag   { font-size: 11.5px; font-weight: 700; fill: #4a7c59; }
    .dim   { font-size: 11.5px; font-weight: 700; fill: #a89880; }
    .axis  { stroke: #a89880; stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>

  <rect class="bg" width="960" height="560"/>
  <text class="t title" x="40" y="40">空間オーディオとアバターの意味</text>

  <!-- floor -->
  <rect class="floor" x="40" y="66" width="520" height="380" rx="12"/>
  <text class="t small" x="58" y="90">テント内（上から見た図）</text>

  <!-- rings around me -->
  <circle class="ring3" cx="300" cy="266" r="170"/>
  <circle class="ring2" cx="300" cy="266" r="115"/>
  <circle class="ring1" cx="300" cy="266" r="62"/>

  <!-- me -->
  <text class="emoji" x="300" y="276" text-anchor="middle">🧍</text>
  <text class="t tag" x="300" y="300" text-anchor="middle">自分</text>

  <!-- near human -->
  <text class="emoji" x="228" y="220" text-anchor="middle">🧍</text>
  <text class="t tag" x="228" y="240" text-anchor="middle">近い＝はっきり聞こえる</text>

  <!-- right human -->
  <text class="emoji" x="410" y="248" text-anchor="middle">🧍</text>
  <text class="t tag" x="410" y="222" text-anchor="middle">右にいる＝右から聞こえる</text>

  <!-- far human -->
  <text class="emoji" x="140" y="396" text-anchor="middle">🧍</text>
  <text class="t dim" x="140" y="416" text-anchor="middle">遠い＝ほぼ聞こえない</text>

  <!-- stone -->
  <text class="emoji" x="452" y="382" text-anchor="middle">🪨</text>
  <text class="t dim" x="452" y="402" text-anchor="middle">石＝話さない（強制ミュート）</text>

  <!-- grass -->
  <text class="emoji" x="118" y="150" text-anchor="middle">🌿</text>
  <text class="t dim" x="126" y="170" text-anchor="middle">草＝話さない</text>

  <line class="axis" x1="300" y1="96" x2="300" y2="436"/>
  <text class="t dim" x="308" y="112">左 ←　→ 右（ステレオ定位）</text>

  <!-- right column -->
  <rect class="card" x="600" y="66" width="320" height="176" rx="10"/>
  <text class="t name"  x="620" y="94">聞こえ方の決まり方</text>
  <text class="t body"  x="620" y="122">・アバター間の距離 → 音量</text>
  <text class="t small" x="634" y="142">近いほど明瞭。遠いとほぼ無音になる</text>
  <text class="t body"  x="620" y="168">・左右のずれ → ステレオのパン</text>
  <text class="t small" x="634" y="188">右にいる人の声は右耳側から聞こえる</text>
  <text class="t body"  x="620" y="214">・向きによる強調は未実装</text>
  <text class="t small" x="634" y="232">遠い人の購読停止（帯域節約）も今後</text>

  <rect class="card" x="600" y="262" width="320" height="184" rx="10"/>
  <text class="t name"  x="620" y="290">アバター2系統の意味</text>
  <text class="t body"  x="620" y="318">🪨 石 ／ 🌿 草 ＝ 非人間</text>
  <text class="t small" x="634" y="338">「話しません」という合図。マイクは強制ミュート</text>
  <text class="t small" x="634" y="356">声を出さずにその場に居られる（初期値は石）</text>
  <text class="t body"  x="620" y="384">🧍 人 ＝ 人型</text>
  <text class="t small" x="634" y="404">「話す可能性あり」。選んで初めてマイクが使える</text>
  <text class="t small" x="634" y="422">足元のリングで人型／非人間と発話中を示す</text>

  <text class="t small" x="40" y="480">この2系統の区別が一目で伝わることが最重要（SPEC F1）。石のままでもテキストチャットには参加できる。</text>
  <text class="t small" x="40" y="502">距離減衰とステレオパンはクライアント側の Web Audio API（GainNode + StereoPannerNode）で処理しており、サーバー側でのミキシングは行わない。</text>
</svg>
